# Copy to settings.yaml and adjust. Validated by `lce validate .`
language: en
languages_enabled: [en]
timezone: UTC                    # any IANA timezone name, e.g. America/Chicago
cadence:
  posts_per_week: 3
  slots:
    - {day: tue, time: "08:30"}
    - {day: wed, time: "08:30"}
    - {day: thu, time: "08:30"}
approval:
  mode: pull_request
  expire_unapproved: true        # unapproved posts are never published
publisher:
  provider: none                 # chosen in a later phase
  max_lateness_minutes: 180
llm:
  runtime: claude_code           # the engine never calls an LLM API
