# `lce init-data` creates config/settings.yaml; the interview fills timezone
# and cadence. Validated by `lce validate .`
timezone: UTC                    # any IANA timezone name, e.g. America/Chicago
cadence:
  posts_per_week: 3
  slots:
    - {day: tue, time: "09:15"}
    - {day: wed, time: "09:15"}
    - {day: thu, time: "09:15"}
approval:
  mode: local
  expire_unapproved: true        # unapproved posts are never published
publisher:
  provider: none                 # Phase 1: no publisher exists
llm:
  runtime: claude_code           # the engine never calls an LLM API
research:
  feeds: []                      # [{name: ..., url: https://...}] — free RSS/Atom feeds only
