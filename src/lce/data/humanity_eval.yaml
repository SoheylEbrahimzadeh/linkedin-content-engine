    fail:
    - substance
- id: failure-good
  area: implementation failures
  kind: good
  content_type: personal_lesson
  stories_used:
  - st-migration
  text: 'The migration I learned the most from didn''t fail on the technology.


    It failed on a Saturday night. We had a cut-over plan, a rollback plan and a tested script. What we
    didn''t have was an agreement on who could call the rollback at 2 a.m. So we waited, and the waiting
    cost more than the bug did.


    Now I write the decision owner into the runbook before I touch the script. Feels like paperwork. It''s
    the first thing I check.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: technical-good
  area: practical technical work
  kind: good
  content_type: how_to
  opinions_used:
  - op-pilots
  text: 'When I review an automation pilot, I want two numbers, not one.


    The first is how much faster the happy path got. Everyone reports that one. The second is how many
    cases dropped out of the flow and landed back on someone''s desk. That one matters more, because that''s
    where the cost hides.


    If a pilot can''t show the second number, I wouldn''t scale it yet. Log every drop-out for two weeks,
    with the step where it happened. After that the call is pretty easy to make, and easy to explain.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: team-good
  area: team/process problems
  kind: good
  content_type: personal_pov
  opinions_used:
  - op-ownership
  text: 'I don''t think handovers fail because people are careless. They fail because nobody owns the
    gap between two teams.


    Ops assumes the project team wrote down the edge cases. The project team assumes ops will ask. Both
    are fair assumptions, and the ticket stuck in between waits a week.


    What I ask for now is one named person from the project side for the first month after go-live. With
    actual time in their calendar for it. A few hours a week, usually.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: team-bad-leadership
  area: team/process problems
  kind: bad
  content_type: personal_pov
  opinions_used:
  - op-ownership
  text: 'Collaboration is the foundation of every successful team.


    Leaders must embrace transparency, empower teams and foster a culture of trust. Those who adapt will
    thrive in the ever-evolving landscape.


    Teamwork makes the dream work. Agree?

    '
  expect:
    verdict: FAIL
    fail:
    - real_person
    - no_stiffness
    - genuine_ending
- id: lesson-bad-no-story
  area: lessons learned
  kind: bad
  content_type: personal_lesson
  text: 'I led a migration that reduced incidents and taught me that planning matters.


    The lesson: always plan for rollback. Preparation is everything.

    '
  expect:
    verdict: FAIL
    errors:
    - lesson.no_story
    - claim.personal_without_story
    fail:
    - no_manufactured_opinion
    - genuine_ending
- id: tension-good
  area: business/technology tension
  kind: good
  content_type: personal_pov
  opinions_used:
  - op-pilots
  text: 'Finance usually asks how much time the automation saves. I think that''s the wrong first question.


    Time saved is easy to promise and hard to bank, because the hours rarely leave the budget. What the
    business actually feels is a decision that gets faster or safer.


    So in a business case I put one decision at the top, with its owner. The time figure goes underneath.
    The conversation with finance tends to get shorter, not longer.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: observation-bad-ai-opening
  area: personal professional observations
  kind: bad
  content_type: observation
  observations_used:
  - ob-reopen
  text: 'As technology continues to evolve, it''s no secret that teams face new challenges.


    Reopened tickets are a game-changer for finding automation opportunities. Let that sink in.


    Thoughts?

    '
  expect:
    verdict: FAIL
    fail:
    - real_person
    - genuine_ending
- id: itsm-bad-editorial
  area: polished consultant/editorial voice
  kind: bad
  content_type: external_insight
  sources:
  - url: https://example.org/survey
    title: Fictional survey
    publisher: Example Org
  text: 'The hard part of chatbots on the service desk is not the chatbot.


    A 2026 survey by Example Org asked service desks what is holding chatbots back. The most cited barriers
    were stale knowledge articles, unclear escalation rules and missing analyst time.


    The three barriers do not name the tool itself. My reading: they are content, control and capacity
    questions. If a bot is going to answer users by itself, it needs current articles, clear limits and
    a team that can correct it.


    That preparation is less visible than a demo. In my view, it decides whether the rollout works.

    '
  expect:
    verdict: FAIL
    errors:
    - voice.editorial_phrase
    - pattern.editorial-label
    - pov.unbacked_belief
    - style.symmetry
    fail:
    - owner_voice
    - spoken
    - no_symmetry
    - no_manufactured_opinion
- id: insight-no-opinion-good
  area: external insight without an owner opinion
  kind: good
  content_type: external_insight
  sources:
  - url: https://example.org/survey
    title: Fictional survey
    publisher: Example Org
  text: 'Example Org surveyed 300 service desks about their chatbots. 40% have paused one in the first
    year.


    The reason they give most often is stale knowledge articles. Not the model.


    That fits how these bots work. They answer from whatever''s in the knowledge base, so an article nobody''s
    touched in two years turns into a wrong answer, delivered with total confidence.


    So how many of those paused bots would''ve been fine with a month of article cleanup first?

    '
  expect:
    verdict: PASS
    min_score: 10
  claims:
  - text: Example Org surveyed 300 service desks about their chatbots
    source_url: https://example.org/survey
  - text: 40% have paused one in the first year
    source_url: https://example.org/survey
