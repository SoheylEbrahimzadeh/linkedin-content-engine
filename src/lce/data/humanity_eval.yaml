# Humanity evaluation set (owner standard 2026-10-05). FICTIONAL persona ("Alex Example") and
# fictional sources only. Each scenario is scored by lce.humanity (10 criteria) with the full QA
# rules. "good" texts must reach 10/10 (PASS): real, spoken, uneven, no manufactured opinion.
# "bad" texts are the patterns the engine must catch (generic, stiff, symmetric, invented,
# editorial, over-explained, manufactured takeaway or emotion).
voice:
  formatting:
    editorial_phrases_allowed: false
    symmetry_allowed: false
golden:
  samples:
  - id: s-standup
    text: I stopped asking teams for automation ideas in workshops. I ask which ticket they reopened twice
      last week. That list is shorter, and it is real.
  - id: s-vendor
    text: The vendor demo worked because the data was clean. Ours was not. I would rather start with the
      mess we have than the process we wish we had.
  - id: s-handover
    text: Most of my time on rollouts goes into the handover, not the build. If the service desk cannot
      explain the rule, the rule will not survive the first incident.
  - id: s-metric
    text: I don't trust a resolution-time chart until I know who closes tickets. The number moves when
      the habit changes, not when the tool does.
  opinions:
  - id: op-rules-first
    text: Write the routing rules people can read before you buy a model; a model only earns its cost
      when the rules stop covering the queue.
    applies_to:
    - itsm-it-operations
    - ai-business-automation
  - id: op-ownership
    text: Automation without a named owner for each decision becomes shelfware within a quarter.
    applies_to:
    - ai-business-automation
    - digital-transformation
  - id: op-pilots
    text: A pilot that only measures speed hides the cost of exceptions; measure the reopened tickets
      too.
    applies_to:
    - practical-ai-implementation
  observations:
  - id: ob-reopen
    text: Teams that track reopened tickets find automation candidates faster than teams that run idea
      workshops.
stories:
  st-migration:
    story_id: st-migration
    publication_status: PUBLIC
    allowed_claims: []
scenarios:
- id: ai-good
  area: AI
  kind: good
  content_type: personal_pov
  opinions_used:
  - op-rules-first
  text: 'I wouldn''t buy a triage model for a queue nobody has written rules for.


    Rules first. Readable ones. A model earns its cost when those rules stop covering the queue. Not before,
    because until then it just adds a decision nobody on the desk can explain.


    There''s a simple check. Can the team say why a ticket went where it went? If they can, the rules
    are doing the job. When they can''t, a model won''t fix that. It''ll hide it.


    So yes, it''s a boring setup on purpose. Rules, someone who owns each one, and a model only where
    the misroutes keep piling up.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: ai-bad
  area: AI
  kind: bad
  content_type: personal_pov
  text: 'In today''s fast-paced world, AI is transforming IT service management.


    Organizations must embrace AI-driven, scalable and innovative solutions to unlock value and drive
    results across the ecosystem.


    The key is to adapt. Leaders who embrace change will win.


    What do you think?

    '
  expect:
    verdict: FAIL
    errors:
    - pov.no_owner_opinion
    - pov.no_stance
    fail:
    - real_person
    - no_manufactured_opinion
    - genuine_ending
- id: automation-good
  area: automation
  kind: good
  content_type: personal_pov
  opinions_used:
  - op-ownership
  text: 'Every automation I''d sign off on has a name next to each decision it makes.


    Not a team name. A person who picks up the phone when the rule closes the wrong ticket. Without that,
    the flow keeps running and nobody trusts it, so people quietly go back to doing it by hand.


    I wouldn''t build anything until someone can tell me who''ll change this rule in six months. If the
    room goes quiet, it''s not ready. Doesn''t matter how good the demo looked.


    Ownership is cheap reliability work. It''s also the bit that gets skipped most.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: automation-bad-transactional
  area: automation
  kind: bad
  content_type: external_insight
  sources:
  - url: https://example.org/report
    title: Fictional report
  text: 'As an expert in automation, I help companies streamline and optimize their workflows.


    A recent report shows that automation saves time across operations teams.


    Looking for new projects? DM me or book a call and let''s connect.

    '
  expect:
    verdict: FAIL
    errors:
    - network.transactional
    fail:
    - real_person
    - genuine_ending
- id: itsm-good
  area: ITSM
  kind: good
  content_type: observation
  observations_used:
  - ob-reopen
  text: 'I''ve seen teams find better automation candidates in their reopened tickets than in any idea
    workshop.


    It makes sense when you think about it. A reopened ticket shows where the process broke twice. Someone
    already paid for that problem. A workshop list mostly shows what annoys people, and that''s not the
    same thing.


    These days I pull last month''s reopened tickets and group them by the step where they broke. Then
    I start with the group the service desk complains about least. That one''s usually invisible, so nobody''s
    tried to fix it.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: itsm-bad-invented
  area: ITSM
  kind: bad
  content_type: observation
  text: 'In my experience, ITSM transformations fail because of culture.


    A client of mine had a robust framework, but the stakeholders alike resisted change.


    It''s all about people. Mindset is everything.

    '
  expect:
    verdict: FAIL
    errors:
    - claim.experience_unsupported
    - observation.no_evidence
    fail:
    - real_person
    - no_manufactured_opinion
    - no_stiffness
- id: transformation-good
  area: digital transformation
  kind: good
  content_type: external_insight
  sources:
  - url: https://example.org/survey
    title: Fictional survey
    publisher: Example Org
  text: 'A survey from Example Org says transformation programmes tend to stall in year two, once the
    easy wins are gone.


    The timing makes sense. There may be another reason, though. Year two is when the owners of the old
    process realise the new one is staying. All the decisions that got pushed back in year one land on
    their desks at once.


    Which reports get switched off? Who approves exceptions now? Nobody planned for those questions, and
    the programme waits on them.

    '
  expect:
    verdict: PASS
    min_score: 10
- id: transformation-bad-summary
  area: digital transformation
  kind: bad
  content_type: external_insight
  sources:
  - url: https://example.org/survey
    title: Fictional survey
    publisher: Example Org
  text: 'According to a new survey from Example Org, digital transformation programmes often stall in
    their second year.


    The survey looked at programmes across several industries and regions.


    It found that early wins become harder to find over time, and that sponsorship tends to decline.


    The full report is available on the Example Org website.

    '
  expect:
    verdict: FAIL
    errors:
