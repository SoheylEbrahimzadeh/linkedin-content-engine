# LCE-051 humanity evaluation set. FICTIONAL persona ("Alex Example") and fictional sources only.
# Each scenario is scored by lce.humanity (10 criteria) with the full QA rules. "good" texts are
# what the engine should produce; "bad" texts are the generic patterns it must catch.
golden:
  samples:
    - id: s-standup
      text: "I stopped asking teams for automation ideas in workshops. I ask which ticket they reopened twice last week. That list is shorter, and it is real."
    - id: s-vendor
      text: "The vendor demo worked because the data was clean. Ours was not. I would rather start with the mess we have than the process we wish we had."
    - id: s-handover
      text: "Most of my time on rollouts goes into the handover, not the build. If the service desk cannot explain the rule, the rule will not survive the first incident."
    - id: s-metric
      text: "I don't trust a resolution-time chart until I know who closes tickets. The number moves when the habit changes, not when the tool does."
  opinions:
    - id: op-rules-first
      text: "Write the routing rules people can read before you buy a model; a model only earns its cost when the rules stop covering the queue."
      applies_to: [itsm-it-operations, ai-business-automation]
    - id: op-ownership
      text: "Automation without a named owner for each decision becomes shelfware within a quarter."
      applies_to: [ai-business-automation, digital-transformation]
    - id: op-pilots
      text: "A pilot that only measures speed hides the cost of exceptions; measure the reopened tickets too."
      applies_to: [practical-ai-implementation]
  observations:
    - id: ob-reopen
      text: "Teams that track reopened tickets find automation candidates faster than teams that run idea workshops."
stories:
  st-migration:
    story_id: st-migration
    publication_status: PUBLIC
    allowed_claims: []
scenarios:
  - id: ai-good
    area: AI
    kind: good
    content_type: personal_pov
    opinions_used: [op-rules-first]
    text: |
      I would not buy a triage model for a queue that nobody has written rules for.

      Readable routing rules come first. The model earns its cost only when those rules stop covering the queue, because before that point it adds a decision nobody on the service desk can explain.

      The test I use is simple. Can the team say why a ticket went where it went? If they can, the rules are doing the work. If they cannot, a model will not fix that; it will hide it.

      So my default is boring on purpose: rules, an owner for each rule, and a model only where the misroutes pile up.
    expect: {min_score: 8, fail: []}
  - id: ai-bad
    area: AI
    kind: bad
    content_type: personal_pov
    text: |
      In today's fast-paced world, AI is transforming IT service management.

      Organizations must embrace AI-driven, scalable and innovative solutions to unlock value and drive results across the ecosystem.

      The key is to adapt. Leaders who embrace change will win.

      What do you think?
    expect: {max_score: 3, errors: [pov.no_owner_opinion, pov.no_stance], fail: [pov, not_consultant, ending]}
  - id: automation-good
    area: automation
    kind: good
    content_type: personal_pov
    opinions_used: [op-ownership]
    text: |
      Every automation I would sign off on has a name next to each decision it makes.

      Not a team name. A person who answers when the rule closes the wrong ticket. Without that owner the flow keeps running, nobody trusts it, and the team quietly goes back to the manual way.

      So before building anything I ask one question: who changes this rule in six months? If the room goes quiet, the automation is not ready, however good the demo looks.

      I think ownership is the cheapest reliability work there is, and the one most often skipped.
    expect: {min_score: 8}
  - id: automation-bad-transactional
    area: automation
    kind: bad
    content_type: external_insight
    sources: [{url: "https://example.org/report", title: Fictional report}]
    text: |
      As an expert in automation, I help companies streamline and optimize their workflows.

      A recent report shows that automation saves time across operations teams.

      Looking for new projects? DM me or book a call and let's connect.
    expect: {max_score: 3, errors: [network.transactional], fail: [network, ending]}
  - id: itsm-good
    area: ITSM
    kind: good
    content_type: observation
    observations_used: [ob-reopen]
    text: |
      I've seen teams find better automation candidates in their reopened tickets than in any idea workshop.

      The reason is plain. A reopened ticket shows where the process failed twice, which means someone already paid for the problem. A workshop list shows what people find annoying, which is not the same thing.

      My rule now: pull last month's reopened tickets, group them by the step where they broke, and start with the group the service desk complains about least. That one is usually invisible, so nobody has tried to fix it yet.
    expect: {min_score: 8}
  - id: itsm-bad-invented
    area: ITSM
    kind: bad
    content_type: observation
    text: |
      In my experience, ITSM transformations fail because of culture.

      A client of mine had a robust framework, but the stakeholders alike resisted change.

      It's all about people. Mindset is everything.
    expect: {max_score: 3, errors: [claim.experience_unsupported, observation.no_evidence], fail: [evidence, not_consultant]}
  - id: transformation-good
    area: digital transformation
    kind: good
    content_type: external_insight
    sources: [{url: "https://example.org/survey", title: Fictional survey, publisher: Example Org}]
    text: |
      A survey from Example Org argues that transformation programmes stall in the second year, when the first easy wins are gone.

      I think the survey is right about the timing and wrong about the cause. The second year is when the owners of the old process notice the new one is staying, and the decisions that were postponed in year one land on their desks.

      That is why I would plan year two around those decisions, not around new features. Which reports get switched off? Who approves exceptions now? Those answers decide whether the programme continues.
    expect: {min_score: 7}
  - id: transformation-bad-summary
    area: digital transformation
    kind: bad
    content_type: external_insight
    sources: [{url: "https://example.org/survey", title: Fictional survey, publisher: Example Org}]
    text: |
      According to a new survey from Example Org, digital transformation programmes often stall in their second year.

      The survey looked at programmes across several industries and regions.

      It found that early wins become harder to find over time, and that sponsorship tends to decline.

      The full report is available on the Example Org website.
    expect: {max_score: 4, errors: [insight.summary_only], fail: [pov, thinking]}
  - id: failure-good
    area: implementation failures
    kind: good
    content_type: personal_lesson
    stories_used: [st-migration]
    text: |
      The migration I learned the most from did not fail on the technology.

      It failed on the weekend. We had a cut-over plan, a rollback plan and a tested script, and nobody had agreed who could decide to roll back at 2 a.m. So we waited, and the wait cost more than the bug.

      Since then I write the decision owner into the runbook before I write the script. It feels like paperwork. It is the part I check first.
    expect: {min_score: 7}
  - id: technical-good
    area: practical technical work
    kind: good
    content_type: how_to
    opinions_used: [op-pilots]
    text: |
      When I review an automation pilot, I ask for two numbers, not one.

      The first is how much faster the happy path got. Everyone reports that. The second is how many cases fell out of the flow and came back to a person, because that is where the cost hides.

      If the pilot cannot show the second number, I would not scale it yet. The team should log every fall-out with the step where it happened for two weeks; then the decision is easy to make and easy to explain.
    expect: {min_score: 7}
  - id: team-good
    area: team/process problems
    kind: good
    content_type: personal_pov
    opinions_used: [op-ownership]
    text: |
      I don't think handovers fail because people are careless. They fail because nobody owns the gap between two teams.

      The ops team assumes the project team documented the edge cases. The project team assumes ops will ask. Both are reasonable, and the ticket that falls between them waits a week.

      What I ask for now is one named owner for the first month after go-live, from the project side, with time in their calendar for it. It costs a few hours a week and it decides whether the change sticks.
    expect: {min_score: 8}
  - id: team-bad-leadership
    area: team/process problems
    kind: bad
    content_type: personal_pov
    opinions_used: [op-ownership]
    text: |
      Collaboration is the foundation of every successful team.

      Leaders must embrace transparency, empower teams and foster a culture of trust. Those who adapt will thrive in the ever-evolving landscape.

      Teamwork makes the dream work. Agree?
    expect: {max_score: 3, fail: [pov, thinking, not_consultant, ending]}
  - id: lesson-bad-no-story
    area: lessons learned
    kind: bad
    content_type: personal_lesson
    text: |
      I led a migration that reduced incidents and taught me that planning matters.

      The lesson: always plan for rollback. Preparation is everything.
    expect: {max_score: 4, errors: [lesson.no_story, claim.personal_without_story]}
  - id: tension-good
    area: business/technology tension
    kind: good
    content_type: personal_pov
    opinions_used: [op-pilots]
    text: |
      Finance asks how much time the automation saves. I think that is the wrong first question.

      Time saved is easy to promise and hard to bank, because the hours rarely leave the budget. The better question is which decision gets faster or safer, since that is where the business feels it.

      So in a business case I put one decision at the top, with its owner, and the time figure underneath. The conversation with finance gets shorter, not longer.
    expect: {min_score: 7}
  - id: observation-bad-ai-opening
    area: personal professional observations
    kind: bad
    content_type: observation
    observations_used: [ob-reopen]
    text: |
      As technology continues to evolve, it's no secret that teams face new challenges.

      Reopened tickets are a game-changer for finding automation opportunities. Let that sink in.

      Thoughts?
    expect: {max_score: 4, fail: [not_consultant, ending, aloud]}
