# Install with:  pre-commit install --install-hooks
# (default_install_hook_types installs both pre-commit and pre-push hooks)
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      # Requires the gitleaks binary on PATH (e.g. `brew install gitleaks`).
      # The hook fails if gitleaks is missing, so it can never be skipped silently.
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-history
        name: gitleaks (full history before push)
        entry: gitleaks git --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: lce-privacy-scan
        name: lce privacy scan
        entry: python -m lce.privacy.scan
        language: system
        pass_filenames: false
      - id: lce-validate-demo
        name: validate demo persona
        entry: python -m lce.cli validate examples/demo-persona
        language: system
        pass_filenames: false
