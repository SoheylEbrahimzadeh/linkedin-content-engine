<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>LCE Cloud Control Center · Personal LinkedIn</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">LCE</span><strong>Content Control Center</strong><span class="brand-sub">Personal LinkedIn</span></div>
    <span id="status" class="status">Loading…</span>
    <button id="refresh" type="button" aria-label="Refresh" title="Refresh">↻</button>
    <button id="estop" type="button" class="danger solid">Emergency stop</button>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="content">
      <div id="banner"></div>
      <main id="main"><p class="empty">Loading…</p></main>
    </div>
  </div>
  <div id="bottombar"></div>
  <noscript>This Control Center needs JavaScript.</noscript>
</body>
</html>
