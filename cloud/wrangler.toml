# Cloudflare Worker for scheduled publishing of human-approved, explicitly
# consented posts. This file contains NO secrets and NO account identifiers.
# The deploy workflow substitutes the placeholders from GitHub Variables/Secrets.
#
# Secrets (never in this repo): set with `wrangler secret put LINKEDIN_TOKEN`
# or in the Cloudflare dashboard.
name = "linkedin-content-engine"   # must match the production Worker (Workers Builds also overrides it)
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true
send_metrics = false          # no Wrangler usage telemetry

[triggers]
# One cron trigger (Free plan allows 5). Cron runs in UTC; the Worker computes
# the configured schedule itself, including DST.
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lce"
database_id = "00000000-0000-0000-0000-000000000000" # replaced at deploy time
migrations_dir = "migrations"

# Cloudflare Access (Zero Trust) identifiers are Worker SECRETS, not [vars]:
# `wrangler deploy` (Workers Builds on every push) replaces plain variables with
# this file but never touches secrets. Set once by the owner:
#   npx wrangler secret put ACCESS_TEAM_DOMAIN   # <team>.cloudflareaccess.com
#   npx wrangler secret put ACCESS_AUD           # 64-hex Application Audience tag
# Missing or malformed values make the API and dashboard refuse everything (503).

[previews]

# Dashboard files are bundled as text and served by the Worker (no extra service).
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true
