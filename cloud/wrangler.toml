# Cloudflare Worker for scheduled publishing of human-approved, explicitly
# consented posts. This file contains NO secrets. Its only deployment-specific
# values are the public Cloudflare Access identifiers in [vars].
#
# Secrets (never in this repo): set with `wrangler secret put LINKEDIN_TOKEN`
# or in the Cloudflare dashboard.
name = "linkedin-content-engine"   # must match the production Worker (Workers Builds also overrides it)
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true
send_metrics = false          # no Wrangler usage telemetry
# Keep variables set in the Cloudflare dashboard across deploys. Without this,
# every Workers Builds deploy replaces dashboard plain-text variables with the
# (empty) [vars] of this file. Secrets are always kept by Wrangler.
keep_vars = true

[triggers]
# One cron trigger (Free plan allows 5). Cron runs in UTC; the Worker computes
# the configured schedule itself, including DST.
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lce"
# No database_id: Wrangler resolves the existing D1 database named "lce" in the
# deploying account (deploy, `d1 migrations apply lce --remote`), so no account
# identifier lives in this public file and no placeholder can be deployed.
migrations_dir = "migrations"

[vars]
# Cloudflare Access application of the production Worker (LCE-031). Both values
# are public: Cloudflare sends the team host and the application AUD to every
# unauthenticated visitor in the login redirect. Carrying them here means every
# Workers Builds deploy configures the Worker itself (dashboard variables were
# lost twice). The Worker still verifies every request's Access JWT against them
# and refuses everything (503) if they are missing or malformed. Optional Worker
# secrets ACCESS_TEAM_DOMAIN + ACCESS_AUD, when both are set, take precedence.
LCE_ACCESS_TEAM_DOMAIN = "small-wood-2de3.cloudflareaccess.com"
LCE_ACCESS_AUD = "2e41a088ef87997e12e9533d2c4860e95dfa8d5b329f6ac864657bef928ffe7a"

# To use another Access application without editing this file, set both Worker
# secrets (they are never removed by deploys and take precedence):
#   npx wrangler secret put ACCESS_TEAM_DOMAIN   # <team>.cloudflareaccess.com
#   npx wrangler secret put ACCESS_AUD           # 64-hex Application Audience tag

[previews]

# Dashboard files are bundled as text and served by the Worker (no extra service).
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true
