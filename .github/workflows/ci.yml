name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,visuals]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Privacy scan
        run: lce privacy-scan
      - name: Validate demo persona
        run: lce validate examples/demo-persona
      - name: Validate dashboard demo data
        run: lce validate examples/demo-dashboard
      - name: Dashboard JS tests
        run: node --version && node --test tests/js/lib.test.mjs
      - name: Build static demo (fictional data only)
        run: lce dashboard build-demo --out _site && ls -R _site
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scan (full history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml
