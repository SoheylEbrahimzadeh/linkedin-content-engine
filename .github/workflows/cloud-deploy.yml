name: cloud-deploy

# Manual only, and disabled until the repository variable
# CLOUD_DEPLOY_ENABLED is set to "true". No secret values live in this file.
# Required when enabled:
#   secrets.CLOUDFLARE_API_TOKEN   (deploy-only API token)
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CLOUDFLARE_D1_DATABASE_ID, vars.ACCESS_TEAM_DOMAIN, vars.ACCESS_AUD
# The LinkedIn token is NOT used here; it is a Worker secret set by the owner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Tests must pass before deploying
        run: npx vitest run
      - name: Fill non-secret deployment identifiers
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          TEAM: ${{ vars.ACCESS_TEAM_DOMAIN }}
          AUD: ${{ vars.ACCESS_AUD }}
        run: |
          # Fail closed on missing or malformed identifiers (each check stops the job).
          [[ "$D1_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "bad CLOUDFLARE_D1_DATABASE_ID"; exit 1; }
          [[ "$TEAM" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]] || { echo "bad ACCESS_TEAM_DOMAIN"; exit 1; }
          [[ "$AUD" =~ ^[0-9a-f]{64}$ ]] || { echo "bad ACCESS_AUD"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_ID}/" wrangler.toml
          sed -i "s/^ACCESS_TEAM_DOMAIN = \"\"/ACCESS_TEAM_DOMAIN = \"${TEAM}\"/" wrangler.toml
          sed -i "s/^ACCESS_AUD = \"\"/ACCESS_AUD = \"${AUD}\"/" wrangler.toml
          ! grep -q '00000000-0000-0000-0000-000000000000\|= ""' wrangler.toml || { echo "placeholders left"; exit 1; }
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply lce --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
